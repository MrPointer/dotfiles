schema_version: "1.0"

preset:
  id: "timors-agentic-workflow"
  name: "Timor's Agentic Workflow"
  version: "0.3.0"
  description: "RFC-backed feature definition, reviewed task packages, and isolated packet execution."
  author: "Timor Gruber"
  license: "MIT"

requires:
  speckit_version: ">=0.12.11"

provides:
  templates:
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Create a ready or draft Feature Definition."
      strategy: "replace"
      replaces: "speckit.specify"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "Converge a Feature Definition through human dialogue."
      strategy: "replace"
      replaces: "speckit.clarify"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Ground, review, and accept the normative RFC."
      strategy: "replace"
      replaces: "speckit.plan"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Create and review an immutable execution package."
      strategy: "replace"
      replaces: "speckit.tasks"
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Bind, isolate, integrate, and verify approved packets."
      strategy: "replace"
      replaces: "speckit.implement"
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Feature Definition template."
      strategy: "replace"
      replaces: "spec-template"
    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Normative RFC template."
      strategy: "replace"
      replaces: "plan-template"
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Task-package index template."
      strategy: "replace"
      replaces: "tasks-template"

tags:
  - "workflow"
  - "planning"
  - "spec-kit"
